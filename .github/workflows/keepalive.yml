# Keeps the free Supabase project from pausing after a quiet week.
# Save this file in your website repo as:  .github/workflows/keepalive.yml
# Then add two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL  = your project URL
#   SUPABASE_KEY  = your publishable key
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */2 * *'   # every second day at 06:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/services?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" > /dev/null
